name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_CLOUD_DISTRIBUTED_EXECUTION: ${{ secrets.NX_CLOUD_ACCESS_TOKEN != '' }}

jobs:
  validation:
    name: Lint, Tests, and Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive base and head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Start two Nx Cloud agents
        if: env.NX_CLOUD_ACCESS_TOKEN != ''
        run: npx nx-cloud start-ci-run --distribute-on="2 linux-medium-js" --stop-agents-after=build

      - name: Check formatting of affected files
        if: github.event_name == 'pull_request'
        run: npx nx format:check --base="$NX_BASE" --head="$NX_HEAD"

      - name: Check formatting of all files
        if: github.event_name == 'push'
        run: npx nx format:check

      - name: Run affected lint, tests, and builds
        if: github.event_name == 'pull_request'
        run: npx nx affected -t lint,test,build --base="$NX_BASE" --head="$NX_HEAD"

      - name: Run lint, tests, and builds for all projects
        if: github.event_name == 'push'
        run: npx nx run-many -t lint,test,build
